<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GTO Solver</title>
<style>
  :root {
    --bg: #0f1216; --panel: #171b21; --panel2: #1e242c; --line: #2a313b;
    --text: #e6e9ee; --muted: #8b94a3; --accent: #f5b942;
    --fold: #4a7bd0; --passive: #3fae6a; --allin: #8b5cc9;
    /* bet/raise sizes, smallest to largest: light to dark so neighbours stay distinct */
    --agg0: #f4a261; --agg1: #e0603a; --agg2: #b3302a; --agg3: #7a1a3a;
    --good: #6bd394; --meh: #f5b942; --bad: #f28b82;
    --red: #d3232a; --blue: #1f5fd1; --green: #1c8a3c;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; }
  header { display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  header .spacer { flex: 1; }
  header .ctl { display: inline-flex; align-items: center; gap: 8px; }
  kbd { font: 11px ui-monospace, Menlo, monospace; border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; margin-left: 6px; color: var(--muted); }
  main { display: grid; grid-template-columns: minmax(440px, 540px) minmax(0, 1fr); gap: 18px; padding: 18px 20px; max-width: 1400px; margin: 0 auto; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 16px; }
  .panel h2 { margin: 0 0 10px; font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .panel h2 .right { margin-left: auto; text-transform: none; letter-spacing: 0; font-weight: 500; }
  button { background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 8px 13px; font: inherit; cursor: pointer; }
  button:hover { border-color: #3c4653; background: #242b34; }
  button.active { background: var(--accent); color: #1a1200; border-color: var(--accent); font-weight: 600; }
  button.small { padding: 4px 9px; font-size: 12px; }
  button.link { background: none; border: 0; padding: 0; color: var(--accent); font-size: 12px; }
  button.link:hover { text-decoration: underline; background: none; }
  button:disabled { opacity: .35; cursor: default; }
  input[type=number] { background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; font: inherit; width: 80px; }
  input:focus { outline: none; border-color: var(--accent); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .muted { color: var(--muted); }
  .seats button { min-width: 50px; padding: 7px 10px; }
  .segment { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .segment button { border: 0; border-radius: 0; min-width: 32px; }
  .segment button + button { border-left: 1px solid var(--line); }

  /* setup summary (collapsed once the hand starts) */
  .setupsum { display: flex; align-items: center; gap: 10px; }
  .setupsum b { font-weight: 600; }

  /* cards */
  .slots { display: flex; gap: 14px; flex-wrap: wrap; }
  .slots + .picker { margin-top: 12px; }
  .slotgroup { display: flex; flex-direction: column; gap: 4px; }
  .slotgroup label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .slotrow { display: flex; gap: 5px; }
  .slot { width: 40px; height: 56px; border-radius: 6px; border: 1px dashed var(--line); background: var(--panel2); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 17px; cursor: pointer; }
  .slot.filled { border-style: solid; background: #f7f7f2; color: #111; }
  .slot.filled:hover { opacity: .55; }
  .slot.sel, .slot.need { outline: 2px solid var(--accent); border-color: var(--accent); }
  .slot.need { animation: pulse 1.2s ease-in-out infinite; }
  .slot.flash { animation: flash .35s ease-in-out 3; }
  @keyframes pulse { 50% { outline-color: transparent; } }
  @keyframes flash { 50% { outline: 3px solid var(--accent); transform: translateY(-3px); } }
  .picker { display: grid; grid-template-columns: repeat(13, 1fr); gap: 3px; }
  .pc { height: 34px; border-radius: 5px; background: #f7f7f2; color: #111; font-weight: 700; font-size: 13px; display: flex; align-items: center; justify-content: center; cursor: pointer; border: 1px solid #ddd; user-select: none; }
  .pc:hover { transform: translateY(-1px); box-shadow: 0 2px 6px rgba(0,0,0,.4); }
  .pc.used { opacity: .18; cursor: not-allowed; }
  .pc.used:hover { transform: none; box-shadow: none; }
  .pc.pend { outline: 2px solid var(--accent); }
  .h, .d { color: var(--red) !important; }
  .four .d { color: var(--blue) !important; }
  .four .c { color: var(--green) !important; }
  .typehint { font-size: 12px; color: var(--muted); margin-top: 8px; }
  .typehint b { color: var(--accent); font-family: ui-monospace, Menlo, monospace; }

  /* table */
  .felt { position: relative; height: 236px; margin: 4px 0 10px; }
  .felt::before { content: ""; position: absolute; inset: 30px 46px; border-radius: 999px; background: radial-gradient(ellipse at center, #1f5a40 0%, #173f2e 70%, #12311f 100%); border: 7px solid #2b2119; box-shadow: inset 0 0 30px rgba(0,0,0,.45), 0 0 0 1px #3a2c20; }
  .felt .center { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); text-align: center; }
  .board { display: flex; gap: 4px; justify-content: center; }
  .bc { width: 30px; height: 42px; border-radius: 4px; background: #f7f7f2; color: #111; font-weight: 700; font-size: 13px; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.05; }
  .bc.empty { background: rgba(0,0,0,.18); border: 1px dashed rgba(255,255,255,.18); }
  .felt .pot { margin-top: 6px; font-size: 12px; color: #d8e6dc; font-variant-numeric: tabular-nums; }
  .seat { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 5px 4px; text-align: center; position: absolute; width: 74px; transform: translate(-50%, -50%); z-index: 2; }
  .seat .pos { font-weight: 700; font-size: 13px; }
  .seat .you { display: block; font-size: 9px; letter-spacing: .1em; color: var(--accent); text-transform: uppercase; }
  .seat .hc { display: block; font-weight: 700; font-size: 12px; }
  .seat .amt { display: block; font-size: 11px; color: var(--muted); margin-top: 1px; font-variant-numeric: tabular-nums; min-height: 15px; }
  .seat.folded { opacity: .35; }
  .seat.folded .pos { text-decoration: line-through; }
  .seat.hero { border-color: #5a4a26; }
  .seat.toact { border-color: var(--accent); background: #2a2413; box-shadow: 0 0 0 1px var(--accent) inset, 0 0 14px rgba(245,185,66,.35); }
  .seat .ta { color: var(--accent); display: block; }
  .seat.allin .amt { color: var(--agg1); }
  .seat.clickable { cursor: pointer; }
  .seat.clickable:hover { border-color: #4a5566; }

  /* action */
  .prompt { display: flex; align-items: baseline; gap: 10px; margin: 0 0 10px; flex-wrap: wrap; }
  .prompt .who { font-size: 17px; font-weight: 700; }
  .prompt .who.hero { color: var(--accent); }
  .prompt .pot { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }
  .prompt .ask { width: 100%; color: var(--muted); font-size: 13px; }
  .acts { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .acts button { padding: 10px 22px 10px 14px; font-weight: 600; position: relative; }
  .acts button.fold { border-color: #3a5a97; }
  .acts button.pass { border-color: #2f7a4d; }
  .acts button.agg { border-color: #9a4a34; }
  .acts button small { display: block; font-weight: 400; font-size: 11px; color: var(--muted); }
  .acts button small .fq { color: var(--text); font-weight: 600; }
  .acts button.best { box-shadow: 0 0 0 2px var(--accent); }
  .acts.solver::before { content: "Solver sizes"; width: 100%; font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  .conv { font-size: 11px; font-weight: 600; border-radius: 999px; padding: 1px 8px; border: 1px solid currentColor; white-space: nowrap; }
  .conv.ok { color: var(--good); } .conv.meh { color: var(--meh); } .conv.bad { color: var(--bad); }
  .chip.rewind, .review li.rewind { cursor: pointer; }
  .chip.rewind:hover { background: #2a313b; }
  .review li.rewind:hover b { text-decoration: underline; }
  .review .streetsum { margin-top: 6px; color: var(--muted); }
  .review .streetsum.total { color: inherit; border-top: 1px solid var(--line); padding-top: 6px; }
  .acts button kbd, .shortcut kbd { position: absolute; top: 3px; right: 3px; margin: 0; font-size: 9px; padding: 0 3px; line-height: 13px; }
  .shortcut { position: relative; padding-right: 26px !important; }
  .custom { display: none; gap: 6px; align-items: center; margin-bottom: 10px; }
  .custom.open { display: flex; }
  .err { color: var(--bad); font-size: 12px; min-height: 16px; }
  .timeline { margin-top: 10px; border-top: 1px solid var(--line); padding-top: 10px; }
  .tl { display: grid; grid-template-columns: 96px 1fr; gap: 6px 10px; align-items: baseline; font-size: 13px; margin-bottom: 5px; }
  .tl .st { color: var(--muted); text-transform: uppercase; font-size: 10px; letter-spacing: .08em; }
  .tl .line { display: flex; gap: 5px; flex-wrap: wrap; }
  .chip { background: var(--panel2); border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px; white-space: nowrap; font-size: 12px; }
  .chip.hero { border-color: var(--accent); }
  .chip.agg { border-color: var(--agg1); }
  .chip.fold { opacity: .6; }
  .g { font-weight: 800; margin-left: 5px; }
  .g.ok { color: var(--good); } .g.meh { color: var(--meh); } .g.bad { color: var(--bad); }
  .keys { font-size: 11px; color: var(--muted); margin-top: 8px; }

  /* advice */
  .note { font-size: 12px; color: var(--muted); background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin-bottom: 12px; line-height: 1.6; }
  .note b { color: var(--text); }
  .review { list-style: none; margin: 6px 0 0; padding: 0; }
  .review li { display: flex; gap: 8px; align-items: baseline; }
  .review .st { text-transform: uppercase; font-size: 10px; letter-spacing: .08em; width: 52px; flex: none; }
  #result.stale { opacity: .45; }
  #result.stale #goAccurate { display: none; }
  .verdict { display: flex; gap: 14px; align-items: baseline; margin: 4px 0 12px; flex-wrap: wrap; }
  .verdict .big { font-size: 24px; font-weight: 700; }
  .verdict .mix { color: var(--muted); font-size: 13px; }
  .arows { display: flex; flex-direction: column; gap: 8px; }
  .arow { display: grid; grid-template-columns: minmax(0, 140px) minmax(40px, 1fr) 62px 76px; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 8px; background: var(--panel2); border: 1px solid transparent; cursor: pointer; }
  .arows.noev .arow { grid-template-columns: minmax(0, 140px) minmax(40px, 1fr) 62px; }
  .arow:hover { border-color: #3c4653; }
  .arow.best { border-color: var(--accent); }
  .arow.head { white-space: nowrap; background: none; cursor: default; padding: 0 10px; font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  .arow.head:hover { border-color: transparent; }
  .arow .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .arow .name small { color: var(--muted); font-weight: 400; margin-left: 6px; }
  .bar { height: 12px; background: #0f1216; border-radius: 4px; overflow: hidden; }
  .bar > div { height: 100%; border-radius: 4px; }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .num.pos { color: var(--good); } .num.neg { color: var(--bad); }
  .meta { color: var(--muted); font-size: 12px; margin-top: 10px; line-height: 1.6; }
  .grid { display: grid; grid-template-columns: repeat(13, 1fr); gap: 2px; margin-top: 6px; }
  .cell { aspect-ratio: 1; border-radius: 3px; position: relative; background: #12161b; font-size: 10px; overflow: hidden; cursor: crosshair; }
  .cell .lbl { position: absolute; left: 3px; top: 2px; color: #fff; text-shadow: 0 0 3px #000; font-weight: 600; z-index: 2; pointer-events: none; }
  .cell .stack { position: absolute; inset: 0; display: flex; pointer-events: none; }
  .cell .stack div { height: 100%; }
  .cell.pair .lbl { color: #ffe9b0; }
  .cell.hov { outline: 2px solid #fff; outline-offset: -1px; z-index: 3; }
  .cell.me { outline: 3px solid var(--accent); outline-offset: -1px; z-index: 3; opacity: 1 !important; transform: scale(1.18); box-shadow: 0 0 0 3px #0f1216, 0 0 14px 2px rgba(245,185,66,.8); overflow: visible; border-radius: 4px; }
  .cell.me .lbl { font-weight: 800; }
  .cell.me .you { position: absolute; right: -2px; bottom: -2px; background: var(--accent); color: #1a1200; font-size: 8px; font-weight: 800; letter-spacing: .08em; padding: 1px 4px; border-radius: 3px; z-index: 4; pointer-events: none; }
  .readout { margin-top: 0; font-size: 13px; min-height: 20px; font-variant-numeric: tabular-nums; }
  .readout b { font-weight: 700; margin-right: 6px; }
  .readout span.a { margin-right: 10px; white-space: nowrap; }
  .readout span.a::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 4px; background: var(--c); }
  #pAdvice { container-type: inline-size; }
  /* range grid: capped so it never grows past ~440px; hover readout sits beside it when there's room */
  .rangewrap { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px 16px; margin-top: 6px; }
  .rangewrap .grid { margin-top: 0; max-width: 440px; width: 100%; }
  @container (min-width: 620px) {
    .rangewrap { grid-template-columns: minmax(0, 400px) minmax(0, 1fr); }
    .rangeside .readout span.a { display: block; margin: 4px 0 0; }
    .rangeside .readout b { display: block; }
  }
  .legend { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 8px; font-size: 12px; color: var(--muted); }
  .legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; background: var(--c); }
  .legend .mehint::before { background: transparent; outline: 2px solid var(--accent); }
  /* whole-range totals above the grid */
  .rangebar { display: flex; height: 16px; border-radius: 4px; overflow: hidden; margin-top: 6px; background: #12161b; }
  .rangebar div { height: 100%; }
  .rangetot { display: flex; gap: 6px 14px; flex-wrap: wrap; margin-top: 6px; font-size: 13px; font-variant-numeric: tabular-nums; }
  .rangetot span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; background: var(--c); }
  .rangetot b { font-weight: 700; }
  .rangetot small { color: var(--muted); }
  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -3px; margin-right: 8px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .prog { height: 4px; background: var(--panel2); border-radius: 2px; overflow: hidden; margin-top: 10px; }
  .prog > div { height: 100%; width: 0; background: var(--accent); transition: width .1s linear; }
  .solvehead { display: flex; align-items: center; }
  .solvehead .num { margin-left: auto; color: var(--muted); font-size: 12px; }
  .empty { color: var(--muted); padding: 30px 10px; text-align: center; line-height: 1.7; }
  details { margin-top: 12px; }
  summary { color: var(--muted); font-size: 12px; cursor: pointer; }
  .villain { font-size: 12px; color: var(--muted); word-break: break-word; margin-top: 6px; }

  .toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: #262d37; border: 1px solid #3c4653; border-radius: 10px; padding: 10px 14px; display: flex; gap: 14px; align-items: center; box-shadow: 0 8px 30px rgba(0,0,0,.5); z-index: 50; max-width: calc(100% - 32px); font-size: 13px; }

  /* two columns: the action panel sits under the table, except while a card is needed, when the deck does */
  @media (min-width: 1001px) {
    .col { display: flex; flex-direction: column; }
    #pAction { order: 2; } #pCards { order: 3; }
    body.needcard #pCards { order: 1; }
  }
  /* one column: table first; on your turn the action buttons (which carry the solver's mix) and then the advice come next */
  @media (max-width: 1000px) {
    main { display: flex; flex-direction: column; gap: 0; padding: 16px; }
    .col { display: contents; }
    #pSetup { order: 10; } #pTable { order: 20; } #pCards { order: 30; } #pAction { order: 40; } #pAdvice { order: 50; }
    body.heroturn #pAction { order: 25; } body.heroturn #pAdvice { order: 26; }
  }
  @media (max-width: 560px) {
    header { padding: 10px 16px; gap: 8px; }
    .panel { padding: 12px; }
    .felt { height: 230px; }
    .felt::before { inset: 26px 26px; }
    .seat { width: 58px; padding: 4px 2px; }
    .seat .pos { font-size: 11px; }
    .bc { width: 24px; height: 34px; font-size: 11px; }
    .pc { height: 30px; font-size: 11px; }
    .slot { width: 34px; height: 48px; font-size: 15px; }
    .slots { gap: 10px; }
    .arow { grid-template-columns: 104px 1fr 48px 62px; gap: 8px; }
    .arows.noev .arow { grid-template-columns: 104px 1fr 48px; }
    .cell { font-size: 7px; }
    .cell .lbl { left: 1px; top: 1px; }
  }
</style>
</head>
<body>
<header>
  <h1>GTO Solver</h1>
  <span class="spacer"></span>
  <span class="ctl" id="oppctl"><span class="muted" style="font-size:12px">Opponents</span>
    <div class="segment"><button data-o="gto" class="active" title="Opponents play the equilibrium (GTO): advice that can't be exploited, whoever you face.">GTO</button><button data-o="pool" title="Opponents play like a typical player pool: they fold too often to bets of every size (most of all small ones), and raise and bluff less (a judgment call: no population data found). Preflop, from population stats, they flat more, 3bet more and fold less to 3bets. Your preflop calls and raises adjust to those ranges (opens follow the chart); after the flop, advice is the highest-EV play against them.">Pool</button></div></span>
  <span class="ctl" id="solvectl"><span class="muted" style="font-size:12px">Solve</span>
    <div class="segment"><button data-m="fast" class="active" title="A few seconds per spot. River answers are solid; turn and flop answers are rough.">Fast</button><button data-m="accurate" title="Much longer per spot (about 30 s with the local server, about a minute in the browser). Turn answers get close to a full solver.">Accurate</button></div></span>
  <button id="fourcolor" class="small" title="Four-colour deck: diamonds blue, clubs green">4-colour</button>
  <button id="copyhand" title="Copy the hand, the advice and a link that reopens this exact spot">Copy hand</button>
  <button id="newhand" title="Shortcut: N">New hand <kbd>N</kbd></button>
</header>

<main>
  <div class="col">
    <section class="panel" id="pSetup">
      <div id="setupFull">
        <div class="row" style="margin-bottom:8px">
          <span class="muted">Players</span>
          <div class="segment" id="players"></div>
          <span class="muted" style="margin-left:auto">stacks</span>
          <input type="number" id="stack" value="100" min="5" step="1"><span class="muted">bb</span>
        </div>
        <div class="row" style="margin-bottom:8px">
          <span class="muted">Ante</span>
          <input type="number" id="ante" value="0" min="0" step="0.05" title="Ante per player, in big blinds"><span class="muted">bb each</span>
          <label class="muted" id="straddleBox" style="margin-left:auto" title="The first seat posts a 2bb straddle and acts last preflop"><input type="checkbox" id="straddle"> straddle</label>
        </div>
        <div class="row">
          <span class="muted">You are</span>
          <div class="row seats" id="seats"></div>
          <button class="link" id="setupDone" style="margin-left:auto" hidden>Done</button>
        </div>
      </div>
      <div id="setupSum" class="setupsum" hidden></div>
    </section>

    <section class="panel" id="pTable">
      <h2>Table <span class="right muted" id="tableHint"></span></h2>
      <div id="felt" class="felt"></div>
    </section>

    <section class="panel" id="pAction">
      <h2>Action <span class="right muted" id="stepLabel"></span></h2>
      <div id="actionArea"></div>
      <div class="err" id="err"></div>
      <div class="timeline" id="timeline"></div>
    </section>

    <section class="panel" id="pCards">
      <h2>Cards <span class="right muted" id="cardsHint"></span></h2>
      <div class="slots">
        <div class="slotgroup"><label>Your hand</label><div class="slotrow" id="holeSlots"></div></div>
        <div class="slotgroup"><label>Flop</label><div class="slotrow" id="flopSlots"></div></div>
        <div class="slotgroup"><label>Turn</label><div class="slotrow" id="turnSlots"></div></div>
        <div class="slotgroup"><label>River</label><div class="slotrow" id="riverSlots"></div></div>
      </div>
      <div class="picker" id="picker"></div>
      <div class="typehint" id="typeHint"></div>
    </section>
  </div>

  <div class="col">
    <section class="panel" id="pAdvice">
      <h2>Advice</h2>
      <div id="adviceNote" class="note" hidden></div>
      <div id="result" class="empty">Pick your seat and cards, then enter the action seat by seat.<br>Advice appears here whenever it's your turn.</div>
    </section>
  </div>
</main>
<div id="toast" class="toast" hidden></div>

<script>
const RANKS = "AKQJT98765432";
const SUITS = ["s", "h", "d", "c"];

      } else if (a.action === "bet" || a.action === "raise") {

  let sc = null;

  else if (!isHero && facing) sc = ["Everyone else folds", () => autoRest(street, "fold")];
  else if (!isHero && !facing && street !== "preflop") sc = ["Everyone checks", () => autoRest(street, "check")];
  if (sc) { const b = document.createElement("button"); b.className = "small shortcut"; b.innerHTML = sc[0] + "<kbd>S</kbd>"; b.dataset.key = "s"; b.onclick = () => { showErr(sc[1]()); renderAll(); }; el.appendChild(b); }
}

// The default preflop raise, as the advisor's _default_size: an open is 2.5x (3x from the SB); over limpers,
// or as a 3bet, 3x (4x from the blinds) plus the chips the other live players put in beyond their blinds

  const extra = [...sim.active].filter(q => q !== p && q !== (last && last.pos)).reduce((t, q) => t + Math.max(0, info.bets[q] - (posted[q] || 0)), 0);

function renderTimeline() {

// ------------------------------------------------------------------ advice

           ...(OPP === "pool" ? { opponents: "pool" } : {}) };

// the payload key of the same spot at another speed
function keyFor(key, speed) {

}
async function analyze(sim) {

  lastKey = key;
  if (cache.has(key)) { renderResult(cache.get(key), key); return; }
  const acc = SPEED === "fast" && cache.get(keyFor(key, "accurate"));
  if (acc) { cache.set(key, acc); renderResult(acc, key); return; }   // an Accurate answer for this spot beats a Fast re-solve
  solving = true;
  const gen = ++solveGen;
  const el = document.getElementById("result");
  el.className = "";
  el.innerHTML = `<div class="solvehead muted"><span class="spinner"></span><span id="solveMsg">Solving the ${sim.current}…${sim.current !== "preflop" && SPEED === "accurate" ? ` (Accurate mode: this can take ${MODE === "wasm" ? "a minute or more" : "up to a minute"})` : ""}</span><span class="num" id="solveTime"></span></div>${sim.current === "preflop" ? "" : '<div class="prog"><div id="solveBar"></div></div>'}`;
  solveStart = performance.now();
  if (MODE === "wasm" && workerStatus !== "Solving…") setStatus(workerStatus || "Loading the solver runtime…");   // runtime still loading
  let est = BUDGET + PRIOR * Math.max(0, STREETS.indexOf(sim.current) - 1);   // earlier postflop streets are re-solved to narrow ranges
  if (SPEED === "accurate") {   // Accurate continues from a Fast solve of this spot, counting its time
    const f = cache.get(keyFor(key, "fast"));
    if (f && f.seconds) est = Math.round(Math.max(est * 0.2, est - f.seconds));
  }

    const t = (performance.now() - solveStart) / 1000, tm = document.getElementById("solveTime"), bar = document.getElementById("solveBar");
    if (MODE === "wasm" && workerStatus !== "Solving…") { if (tm) tm.textContent = ""; return; }   // runtime still loading: no solve clock yet
    if (tm && sim.current !== "preflop") tm.textContent = `${t.toFixed(1)}s of ~${fmt(est)}s`;
    if (bar) bar.style.width = Math.min(97, t / est * 100) + "%";
  }, 100);
  let res;
  try { res = await callAdvise(JSON.parse(key)); }
  catch (e) { res = { error: "Request failed: " + e }; }
  clearInterval(tick);

  if (res.cancelled) { solving = false; lastKey = null; return; }        // cancelled by another tab on the same server
  if (!res.error) cache.set(key, res);

}
// Bets and raises are shaded light to dark by size, so "bet 33%" and "bet 75%" never look alike.
let CMAP = {};
function setColors(names) {

  const agg = names.filter(n => /^(bet|raise)/.test(n)).sort((a, b) => size(a) - size(b));
  const shades = agg.length === 1 ? [1] : agg.length === 2 ? [0, 2] : agg.length === 3 ? [0, 1, 2] : [0, 1, 2, 3];

const COLORS = (n) => n === "fold" ? "var(--fold)" : n === "check" || n === "call" ? "var(--passive)" : n === "all-in" ? "var(--allin)" : CMAP[n] || "var(--agg1)";

  let h = `<div class="meta" style="margin:0 0 4px">${res.street} · ${res.hero} ${res.hand}${res.position ? " · " + res.position : ""}${board ? " · " + board : ""}${res.pot_bb ? " · pot " + res.pot_bb + " bb" : ""}</div>`;

  }
  h += `<div class="meta" style="margin-top:10px">By hand <span class="muted">· hover a hand for its mix</span></div><div class="rangewrap"><div class="grid">`;
  for (let i = 0; i < 13; i++) for (let j = 0; j < 13; j++) {
    const cls = gridClass(i, j);
    const c = grid.cells[cls] || { w: 0, f: [] }, me = cls === heroHand;
    const op = c.w <= 0 ? 0.08 : 0.25 + 0.75 * Math.min(1, c.w);
    let stack = "";
    if (c.w > 0) for (let a = 0; a < names.length; a++) stack += `<div style="width:${(c.f[a] * 100).toFixed(1)}%;background:${COLORS(names[a])}"></div>`;
    h += `<div class="cell${i === j ? " pair" : ""}${me ? " me" : ""}" data-h="${cls}" style="opacity:${op}"><div class="stack">${stack}</div><span class="lbl">${cls}</span>${me ? '<span class="you">YOU</span>' : ""}</div>`;
  }
  return h + `</div><div class="rangeside"><div class="readout" id="readout"></div><div class="legend"><span class="mehint">your hand</span></div></div></div>`;
}
function wireGrid(root, grid, heroHand) {
  const out = root.querySelector("#readout"), g = root.querySelector(".grid");
  const show = (cls) => {
    const c = grid.cells[cls];
    out.innerHTML = `<b>${cls}${cls === heroHand ? " (you)" : ""}</b>` + (c && c.w > 0
      ? grid.actions.map((n, a) => c.f[a] >= 0.005 ? `<span class="a" style="--c:${COLORS(n)}">${n} ${(c.f[a] * 100).toFixed(0)}%</span>` : "").join("")
      : `<span class="muted">not in your range here</span>`);
  };
  let hov = null;
  const over = (e) => { const cell = e.target.closest(".cell"); if (!cell || cell === hov) return; if (hov) hov.classList.remove("hov"); hov = cell; cell.classList.add("hov"); show(cell.dataset.h); };
  g.addEventListener("mouseover", over); g.addEventListener("click", over);
  g.addEventListener("mouseleave", () => { if (hov) hov.classList.remove("hov"); hov = null; show(heroHand); });
  show(heroHand);
}
function applyAction(a) {
  const sim = simulate();
  if (sim.toAct !== S.hero || !sim.cur) { showErr("It's not your turn now."); return; }
  showErr(act(["check", "call", "fold", "all-in"].includes(a.action) ? { action: a.action } : { action: "bet", to: a.amount_bb })); renderAll();
}
// Say what the advice panel is showing: live advice, old advice from an earlier decision, or the end-of-hand review.
function updateAdviceState() {
  const sim = simulate(), note = document.getElementById("adviceNote"), el = document.getElementById("result");
  const heroTurn = sim.toAct === S.hero && !!sim.cur && S.cards[0] && S.cards[1];
  document.body.classList.toggle("heroturn", !!heroTurn);
  const live = heroTurn && (solving || resultKey === JSON.stringify(payload()));
  el.classList.toggle("stale", !!lastResult && !live && !solving);
  const mine = []; for (const s of STREETS) for (const a of S.actions[s]) if (a.pos === S.hero && a.g) mine.push([s, a]);
  const perStreet = STREETS.map(s => [s, mine.filter(([ms]) => ms === s).reduce((t, [, a]) => t + (a.g.l || 0), 0)]).filter(([s]) => mine.some(([ms]) => ms === s));
  const streetSum = perStreet.length > 1 ? `<li class="streetsum">EV given up: ${perStreet.map(([s, l]) => `${s} ${l > 0.005 ? `<span class="num neg">−${l.toFixed(2)}</span>` : "0"}`).join(" · ")}</li>` : "";
  const withEv = mine.filter(([, a]) => a.g.l != null), totalLost = withEv.reduce((t, [, a]) => t + a.g.l, 0);
  const totalSum = withEv.length ? `<li class="streetsum total"><b>EV loss vs GTO: ${totalLost > 0.005 ? `<span class="num neg">−${totalLost.toFixed(2)} bb</span>` : `<span class="num pos">0.00 bb</span>`}</b>${withEv.length < mine.length ? ` <span class="muted">(${withEv.length} of ${mine.length} decisions have EVs)</span>` : ""}</li>` : "";
  const list = mine.length ? `<ul class="review">${mine.map(([s, a]) => `<li class="rewind" data-s="${s}" data-i="${S.actions[s].indexOf(a)}" title="Replay from here. ${gradeTip(a.g)}"><span class="st">${s}</span><span class="g ${gradeClass(a.g)}" style="margin:0">${gradeMark(a.g)}</span><span><b>${a.action === "bet" ? "bet " + fmt(a.to) : a.action === "raise" ? "raise to " + fmt(a.to) : a.action}</b> · solver ${(a.g.f * 100).toFixed(0)}% · ${a.g.e != null || !a.g.l ? evLossHtml(a.g) : `<span class="num neg">−${a.g.l.toFixed(2)} bb</span>`}${a.g.r ? ` <span class="muted">(rough solve)</span>` : ""}</span></li>`).join("")}${streetSum}${totalSum}</ul>` : "";
  let msg = "";
  if (sim.handOver && S.cards[0] && S.cards[1]) {
    const lost = mine.reduce((t, [, a]) => t + (a.g.l || 0), 0), good = mine.filter(([, a]) => gradeClass(a.g) === "ok").length;
    msg = mine.length ? `<b>Hand review</b> · ${good} of ${mine.length} decisions in the solver's mix${withEv.length ? ` · ${lost > 0.005 ? `<span class="num neg">−${lost.toFixed(2)} bb</span>` : "0.00 bb"} EV vs GTO` : ""}${list}` : `<b>Hand over.</b> No solved decisions to review.`;
  } else if (lastResult && !live && !solving) {
    msg = `<b>Advice from your last decision (${lastResult.street || "earlier"}).</b> New advice appears when it's your turn again.${list}`;
  } else if (!heroTurn && mine.length) msg = `<b>Your decisions so far</b>${list}`;
  note.hidden = !msg; note.innerHTML = msg;
  note.querySelectorAll("li.rewind").forEach(li => li.onclick = () => rewindTo(li.dataset.s, +li.dataset.i));
  if (sim.handOver && mine.length) note.insertAdjacentHTML("beforeend", `<div class="muted" style="margin-top:4px">Click a decision to replay the hand from there.</div>`);
  if (el.classList.contains("empty")) el.innerHTML = S.cards[0] && S.cards[1]
    ? (sim.handOver ? "Hand over." : "Waiting for your turn.<br>Enter what the others do; advice appears when the action reaches you.")
    : EMPTY_ADVICE;
}

// ------------------------------------------------------------------ wiring
function renderAll() {
  const sim = simulate();
  if (!needCard(sim)) pendingRank = null;
  document.body.classList.toggle("needcard", needCard(sim));
  renderSetup(); renderSlots(sim); renderPicker(sim); renderTable(sim); renderAction(sim); renderTimeline();
  if (sim.toAct === S.hero && S.cards[0] && S.cards[1] && !sim.handOver) analyze(sim);
  else if (!S.cards[0] || !S.cards[1]) resetAdvice();
  updateAdviceState();
}
const EMPTY_ADVICE = "Pick your seat and cards, then enter the action seat by seat.<br>Advice appears here whenever it's your turn.";
function resetAdvice() {
  const el = document.getElementById("result"); lastKey = null; lastResult = null; resultKey = null;
  if (el.className !== "empty") { el.className = "empty"; el.innerHTML = EMPTY_ADVICE; }
}
// ---- share: plain-text summary + link that reopens the spot
function handText() {
  const n = S.players, seat = SEAT_LABEL(S.hero, n);
  const lines = [`GTO Solver hand: ${n}-handed, ${S.stack}bb effective${ANTE() ? `, ${fmt(ANTE())}bb ante` : ""}${STRADDLER() ? `, ${SEAT_LABEL(STRADDLER(), n)} straddles 2bb` : ""}, I am ${seat} with ${S.cards[0] || "?"}${S.cards[1] || "?"}`];
  const act = (a) => `${SEAT_LABEL(a.pos, n)} ${a.action === "bet" ? "bets " + fmt(a.to) : a.action === "raise" ? "raises to " + fmt(a.to) : a.action === "all-in" ? "all-in" : a.action + "s"}${a.g ? ` [${gradeMark(a.g)} solver ${(a.g.f * 100).toFixed(0)}%${a.g.l ? `, -${a.g.l.toFixed(2)}bb` : ""}]` : ""}`;
  const bd = (s) => s === "preflop" ? "" : " (" + boardCards().slice(NEED[s] - (s === "flop" ? 3 : 1), NEED[s]).join(" ") + ")";
  const sim = simulate();
  for (const s of STREETS) {
    if (!S.actions[s].length && !(sim.current === s && sim.cur)) continue;
    let line = `${s[0].toUpperCase() + s.slice(1)}${bd(s)}: ` + S.actions[s].map(act).join(", ");
    if (sim.current === s && sim.cur) line += `${S.actions[s].length ? " — " : ""}${SEAT_LABEL(sim.toAct, n)} to act, pot ${fmt(sim.cur.pot)}bb`;
    lines.push(line);
  }
  const r = lastResult;
  if (r && !r.error) {
    lines.push(`Advice (${r.street}${r.position ? ", " + r.position : ""}${r.actions.some(a => a.gto_freq !== undefined) ? ", vs a typical player pool" : ""}): ${r.recommended}`);
    lines.push("  " + r.actions.map(a => `${a.action}${a.amount_bb != null ? " " + a.amount_bb + "bb" : ""} ${(a.freq * 100).toFixed(1)}%${a.gto_freq !== undefined ? ` (GTO ${(a.gto_freq * 100).toFixed(0)}%)` : ""}${a.ev_bb !== undefined ? " EV " + (a.ev_bb > 0 ? "+" : "") + a.ev_bb.toFixed(2) : ""}`).join(" | "));
    if (r.range_action_freq) lines.push("  whole range: " + Object.entries(r.range_action_freq).map(([k, v]) => `${k} ${(v * 100).toFixed(0)}%`).join(", "));
    if (r.villain_range) lines.push(`  ${r.villain} range (${r.villain_range_combos} combos): ${r.villain_range}`);
    if (r.multiway) lines.push(`  equity vs field ${(r.equity_vs_field * 100).toFixed(0)}% (heuristic, ${r.opponents.length + 1} players)`);
    if (r.solver) lines.push(`  solver: ${r.solver.iterations} iterations, ${r.solver.solve_seconds}s, ${r.solver.active_combos} combos, sizes ${r.solver.tree_actions.join(", ")}`);
    if (r.notes && r.notes.length) lines.push("  notes: " + r.notes.join("; "));
  }
  const link = location.origin + location.pathname + "#h=" + encodeState(S);
  lines.push("Open this spot: " + link);
  lines.push("State JSON: " + JSON.stringify(payload()));
  return lines.join("\n");
}
document.getElementById("copyhand").onclick = async () => {
  const b = document.getElementById("copyhand");
  if (!MODE) await modeReady;   // the copied state carries the budgets, which depend on the backend
  const text = handText();
  try { await navigator.clipboard.writeText(text); b.textContent = "Copied"; }
  catch (e) { window.prompt("Copy this:", text); b.textContent = "Copy hand"; return; }
  setTimeout(() => b.textContent = "Copy hand", 1500);
};
(function loadFromLink() {
  const m = location.hash.match(/#h=([A-Za-z0-9+/=]+)/);
  if (!m) return;
  try {
    const st = cleanState(decodeState(m[1]));
    if (st) { S = st; setPositions(S.players); save(); }
  } catch (e) {}
  history.replaceState(null, "", location.pathname);
})();
document.getElementById("stack").value = S.stack;
document.getElementById("stack").onchange = (e) => { S.stack = parseFloat(e.target.value) > 0 ? parseFloat(e.target.value) : 100; e.target.value = S.stack; save(); renderAll(); };
document.getElementById("ante").value = ANTE();
document.getElementById("ante").onchange = (e) => { S.ante = Math.max(0, parseFloat(e.target.value) || 0); save(); resetAdvice(); renderAll(); };
document.getElementById("straddle").checked = !!S.straddle;
document.getElementById("straddle").onchange = (e) => { S.straddle = e.target.checked; save(); resetAdvice(); renderAll(); };
document.getElementById("setupDone").onclick = () => { editSetup = false; renderAll(); };

// ---- four-colour deck (per browser)
function applyFour(on) { document.body.classList.toggle("four", on); document.getElementById("fourcolor").classList.toggle("active", on); }
let four = false; try { four = localStorage.getItem("fourcolor") === "1"; } catch (e) {}
applyFour(four);
document.getElementById("fourcolor").onclick = () => { four = !four; applyFour(four); try { localStorage.setItem("fourcolor", four ? "1" : "0"); } catch (e) {} };

// ---- keyboard: cards are typed as rank+suit while a card is needed, otherwise keys pick actions
document.addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey || /input|textarea|select/i.test(e.target.tagName)) return;
  const k = e.key, low = k.toLowerCase();
  if (k === "Escape") { pendingRank = null; selSlot = null; showDeck = false; const cb = document.getElementById("customBox"); if (cb) cb.classList.remove("open"); renderAll(); return; }
  if (low === "n") { e.preventDefault(); document.getElementById("newhand").click(); return; }
  const sim = simulate();
  if (needCard(sim)) {
    if (pendingRank && "shdc".includes(low) && k.length === 1) {
      e.preventDefault();
      if (pendingRank === "1") { pendingRank = null; renderAll(); return; }
      const c = pendingRank + low; pendingRank = null; placeCard(c); renderAll(); return;
    }
    if (pendingRank === "1" && k === "0") { e.preventDefault(); pendingRank = "T"; renderAll(); return; }
    if (k.length === 1 && (RANKS.includes(k.toUpperCase()) || k === "1")) { e.preventDefault(); pendingRank = k.toUpperCase(); renderAll(); return; }
    if (k === "Backspace" && pendingRank) { e.preventDefault(); pendingRank = null; renderAll(); return; }
    return;
  }
  if (low === "u" || k === "Backspace") { e.preventDefault(); undo(); return; }
  const key = low === "x" ? "c" : low;   // X also checks
  const b = document.querySelector(`#actionArea [data-key="${CSS.escape(key)}"]`);
  if (b) { e.preventDefault(); b.click(); }
});
document.getElementById("newhand").onclick = () => {
  S = { ...fresh(S.players), hero: S.hero, stack: S.stack, ante: S.ante, straddle: S.straddle }; selSlot = null; showDeck = false; editSetup = false; pendingRank = null; save(); resetAdvice(); renderAll();
};
renderAll();
</script>
